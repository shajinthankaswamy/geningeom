[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geningeox"
version = "0.0.1"
description = "Generative inverse design of time-varying photonic metastructures in JAX (under active development)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shajin Thankaswamy" }]
keywords = ["inverse design", "FDTD", "JAX", "time-varying media", "metasurfaces", "generative models"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/shajinthankaswamy/GenInGeoX"
Repository = "https://github.com/shajinthankaswamy/GenInGeoX"
